[project]
name = "libreoffice-mcp"
version = "0.1.0"
description = "MCP server exposing LibreOffice document creation/editing through the Model Context Protocol"
readme = "README.md"
authors = [
    { name = "sm33f3r", email = "235947033+sm33f3r@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=1.0.0,<2",
    "python-docx>=1.2.0",
    "docx-revisions>=0.1.0",
    "python-pptx>=1.0.0",
    "httpx>=0.27.0",
    "typer>=0.12",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[project.scripts]
libreoffice-mcp = "libreoffice_mcp.server:main"

[build-system]
requires = ["uv_build>=0.11.1,<0.12.0"]
build-backend = "uv_build"